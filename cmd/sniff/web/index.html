<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sniff</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>sniff</h1>
  <span id="status" class="status">connecting…</span>
  <button type="button" id="goto" class="goto" aria-haspopup="dialog">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <span class="grow">Go to an address, view or function, or call one…</span>
    <kbd class="mod-k">⌘K</kbd>
  </button>
  <span class="grow"></span>
  <label class="follow"><input type="checkbox" id="follow" checked> follow</label>
</header>
<div class="window">
  <nav class="side" aria-label="Sidebar">
    <div class="group">
      <h2>Needs you</h2>
      <a class="queue review" href="/view/review/pending" title="what waits for your review; while sniff is open, agents' writes wait here for you"><span class="name">Review</span></a>
      <a class="queue inbox" href="/view/me/inbox" title="questions and reports sent to you, :me"><span class="name">Inbox</span></a>
    </div>
    <div class="group">
      <h2>Views</h2>
      <div id="pins"></div>
    </div>
    <div class="group" id="agents-group" hidden>
      <h2>Agents</h2>
      <div id="agents"></div>
    </div>
    <div class="group">
      <h2>Services</h2>
      <div id="addresses"></div>
    </div>
  </nav>
  <div class="work">
    <div id="tabs" class="tabs" role="tablist" aria-label="Tabs">
      <div class="tab"><button role="tab" id="tab-activity" aria-selected="true" aria-controls="activity">Activity</button></div>
    </div>
    <section id="banner" class="banner" aria-label="Waiting for your review" hidden>
      <span class="banner-title">Waits for your review</span>
      <div id="banner-body" class="banner-body"></div>
    </section>
    <form id="filters" class="filters" role="search" aria-label="Filter messages">
      <button type="button" id="only" class="chip" aria-pressed="true" title="Show every chain again" hidden>One chain ×</button>
      <button type="button" class="chip" data-term="kind:err" aria-pressed="false" title="kind:err: what answered with an error or a fault">Errors</button>
      <button type="button" class="chip" data-term="time:>500ms" aria-pressed="false" title="time:>500ms">Slow &gt; 500ms</button>
      <button type="button" class="chip" data-term="mark:write" aria-pressed="false" title="mark:write: to :write functions">Writes</button>
      <input id="query" type="search" aria-label="Filter" placeholder="Filter: to:plan kind:err -to:gh …  ( / )" autocomplete="off" spellcheck="false"
        title="Each term must match; -term must not. to:address[/fn] from:address origin:user|agent kind:call|send|pub|done|eval|note|ok|err|fault|pending time:>500ms|<1ms mark:read|write gate:held|refused|accepted|trusted|free|for, or a word">
      <span class="seg" role="group" aria-label="Show messages as">
        <button type="button" data-show="chains" aria-pressed="true" title="Each message under the one whose handler sent it">Chains</button>
        <button type="button" data-show="lanes" aria-pressed="false" title="A lane per address, an arrow per message">Lanes</button>
      </span>
      <span id="query-error" class="query-error" role="status"></span>
    </form>
    <main id="activity" role="tabpanel" aria-labelledby="tab-activity">
      <section id="trace" aria-label="Messages">
        <div id="lanes" class="lanes"></div>
        <div id="rows"></div>
        <p id="empty" class="empty">No messages yet. Call a service and it shows here.</p>
      </section>
      <aside id="detail" aria-label="Details">
        <p class="hint">Click a message for its arguments and reply, or an address for its functions and state.</p>
      </aside>
    </main>
  </div>
</div>
<dialog id="palette" class="palette" aria-label="Go to or call">
  <div class="palette-box">
    <div class="palette-input">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="palette-q" role="combobox" aria-label="Go to or call" aria-controls="palette-list" aria-expanded="true" aria-autocomplete="list"
        placeholder="Go to an address, view or function, or call one…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <div id="palette-list" class="palette-list" role="listbox" aria-label="Matches"></div>
    <div id="palette-reply" class="palette-reply"></div>
    <p class="palette-keys"><span><kbd>↑↓</kbd> move</span> <span><kbd>↵</kbd> open or call</span> <span><kbd>(</kbd> type a whole form: <code>(todo/add "x")</code></span></p>
  </div>
</dialog>
</body>
</html>
