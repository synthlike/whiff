<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sniff</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>sniff</h1>
  <span id="status" class="status">connecting…</span>
  <nav id="addresses" aria-label="Addresses"></nav>
  <label class="follow"><input type="checkbox" id="follow" checked> follow</label>
</header>
<main>
  <section id="trace" aria-label="Messages">
    <div id="lanes" class="lanes"></div>
    <div id="rows"></div>
    <p id="empty" class="empty">No messages yet. Call a service and it shows here.</p>
  </section>
  <aside id="detail" aria-label="Details">
    <p class="hint">Click a message for its arguments and reply, or an address for its functions and state.</p>
  </aside>
</main>
</body>
</html>
